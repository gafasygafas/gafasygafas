<style>
  :root{
    --gg-black:#111111; --gg-yellow:#FFD756; --gg-yellow-editorial:#F2D23B;
    --gg-bone:#F4F4F2; --gg-gray-200:#D9D9D9; --gg-gray-500:#8A8A8A; --gg-gray-700:#5A5A5A;
    --gg-success:#2E9E5B; --gg-alert:#D64545;
    --font-display:'Anton',Impact,'Arial Narrow',sans-serif;
    --font-body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    --font-editorial:'Bodoni Moda','Libre Bodoni',Didot,Georgia,serif;
    --radius:10px; --radius-card:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--gg-bone);color:var(--gg-black)}
  body{font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.125em}
  img{max-width:100%}
  header{position:sticky;top:0;z-index:20;background:var(--gg-black);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;min-height:64px}
  header .logo{height:42px;width:auto;display:block}
  header button,header a.hl{background:none;border:0;color:#fff;font:inherit;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;cursor:pointer;padding:8px;text-decoration:none;display:flex;align-items:center;gap:6px}
  header [hidden]{display:none}
  .app{max-width:600px;margin:0 auto}
  main{padding:20px 16px 32px}
  h1{font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:40px;line-height:1.2;margin:12px 0 12px;letter-spacing:.2px}
  h2{font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:24px;line-height:1.15;margin:0 0 10px;letter-spacing:.3px}
  mark{background:var(--gg-yellow);color:var(--gg-black);padding:0 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .eyebrow{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;margin:0}
  .eyebrow::before{content:'';width:14px;height:14px;border-radius:50%;background:var(--gg-black);box-shadow:20px 0 0 var(--gg-yellow);margin-right:20px;flex:none}
  .lead{font-size:17px;color:var(--gg-gray-700);margin:0 0 18px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:14px 16px;border:2px solid var(--gg-black);border-radius:var(--radius);cursor:pointer;font-family:var(--font-display);font-weight:400;font-size:17px;letter-spacing:.7px;text-transform:uppercase;text-decoration:none;background:var(--gg-black);color:var(--gg-yellow);line-height:1.15;text-align:center}
  .btn.outline{background:#fff;color:var(--gg-black)}
  .btn.yellow{background:var(--gg-yellow);color:var(--gg-black)}
  .btn.small{min-height:48px;font-size:15px;padding:10px 12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stack>*+*{margin-top:10px}
  .ticks{list-style:none;padding:16px 0 4px;margin:18px 0 0;border-top:2px solid var(--gg-black)}
  .ticks li{display:flex;gap:12px;align-items:center;font-size:13px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;padding:6px 0}
  .ticks li::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--gg-yellow);border:2px solid var(--gg-black);flex:none}
  .tag{display:inline-block;background:var(--gg-black);color:var(--gg-yellow);font-family:var(--font-display);text-transform:uppercase;font-size:18px;letter-spacing:.8px;padding:4px 14px;border-radius:8px}
  .sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 12px}
  .sechead .count{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--gg-gray-700)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;border:2px solid var(--gg-black);background:#fff;color:var(--gg-black);border-radius:999px;padding:8px 16px;font:700 13px var(--font-body);letter-spacing:1.1px;text-transform:uppercase;cursor:pointer}
  .chips button.on{background:var(--gg-black);color:var(--gg-yellow)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:#fff;border:2px solid var(--gg-black);border-radius:var(--radius-card);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
  .card .ph{aspect-ratio:1/1;background:#f1f1f1;display:block;overflow:hidden;border-bottom:2px solid var(--gg-black);position:relative}
  .card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .card .try{position:absolute;left:8px;top:8px;background:var(--gg-yellow);color:var(--gg-black);font:700 11px var(--font-body);letter-spacing:1.1px;text-transform:uppercase;padding:4px 8px;border-radius:999px;display:flex;gap:5px;align-items:center}
  .card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
  .card b{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.3px;line-height:1.1}
  .card .meta{font-size:14px;color:var(--gg-gray-700)}
  .card .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
  .card .price{font-weight:700;font-size:17px}
  .card .go{width:34px;height:34px;border-radius:50%;border:2px solid var(--gg-black);display:grid;place-items:center;flex:none}
  .tagline{font-family:var(--font-editorial);font-style:italic;text-align:center;font-size:20px;margin:30px 0 4px}
  .foot{font-size:13px;color:var(--gg-gray-700);text-align:center;margin:0}
  .foot a{color:inherit}

  /* Hoja para elegir cámara o foto */
  .sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(17,17,17,.55)}
  .sheet[hidden]{display:none}
  .sheet .in{background:var(--gg-bone);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));border-top:3px solid var(--gg-black)}
  .sheet .pick{display:flex;gap:14px;align-items:center;margin:0 0 16px}
  .sheet .pick img{width:120px;height:auto;background:#fff;border:2px solid var(--gg-black);border-radius:12px;padding:8px}
  .sheet .x{background:none;border:0;font:700 13px var(--font-body);letter-spacing:1.1px;text-transform:uppercase;color:var(--gg-gray-700);display:block;margin:14px auto 0;cursor:pointer;padding:8px}

  /* Probador */
  .stagewrap{position:relative;display:flex;justify-content:center;background:var(--gg-black);border-radius:var(--radius-card);overflow:hidden;min-height:260px;border:2px solid var(--gg-black)}
  #cv{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain}
  .hint{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(17,17,17,.88);color:#fff;border-radius:var(--radius);padding:10px 12px;text-align:center;font-weight:700;font-size:15px}
  .hint[hidden]{display:none}
  .oval{position:absolute;top:50%;left:50%;width:58%;aspect-ratio:3/4;transform:translate(-50%,-54%);border:3px dashed rgba(255,215,86,.9);border-radius:50%;pointer-events:none}
  .oval[hidden]{display:none}
  .approx{position:absolute;top:10px;left:10px;background:rgba(17,17,17,.8);color:#fff;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:5px 10px;border-radius:999px}
  .loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:var(--gg-black);color:#fff;padding:20px}
  .loading[hidden]{display:none}
  .spin{width:48px;height:48px;border-radius:50%;border:5px solid #333;border-top-color:var(--gg-yellow);margin:0 auto 14px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .strip button{flex:0 0 30%;scroll-snap-align:start;background:#fff;border:2px solid var(--gg-gray-200);border-radius:12px;padding:8px 6px 6px;cursor:pointer;color:var(--gg-black);font:inherit}
  .strip button.sel{border-color:var(--gg-black);box-shadow:0 0 0 3px var(--gg-yellow)}
  .strip img{width:100%;height:40px;object-fit:contain;display:block}
  .strip span{display:block;font-size:11px;font-weight:700;letter-spacing:1px;margin-top:4px}
  .panel{background:#fff;border:2px solid var(--gg-black);border-radius:var(--radius-card);padding:16px;margin-top:14px}
  .info{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .info .cat{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--gg-gray-700)}
  .info b{font-family:var(--font-display);font-weight:400;font-size:32px;letter-spacing:.4px;display:block;line-height:1.05}
  .info .price{font-family:var(--font-display);font-size:26px;white-space:nowrap;line-height:1.1;text-align:right}
  .info .price s{display:block;font-family:var(--font-body);font-size:13px;color:var(--gg-gray-500)}
  .lbl{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;margin:14px 0 8px}
  .lbl em{font-style:normal;color:var(--gg-gray-700);text-transform:none;letter-spacing:.2px;font-weight:500;font-size:14px;margin-left:6px}
  .swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .swatches button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--gg-gray-200);cursor:pointer;padding:0}
  .swatches button.sel{box-shadow:0 0 0 2px var(--gg-black),0 0 0 5px var(--gg-yellow)}
  .sizer{display:flex;align-items:center;gap:12px}
  .sizer button{width:42px;height:42px;border-radius:50%;border:2px solid var(--gg-black);background:#fff;color:var(--gg-black);font-size:22px;line-height:1;cursor:pointer}
  .sizer span{font-size:14px;font-weight:700}
  .sizenote{display:flex;gap:10px;align-items:flex-start;background:var(--gg-bone);border-left:4px solid var(--gg-yellow);border-radius:8px;padding:10px 12px;margin:12px 0 0;font-size:14px;line-height:1.45;color:var(--gg-gray-700)}
  .sizenote svg{flex:none;width:18px;height:18px;margin-top:2px}
  .sizenote b{color:var(--gg-black)}
  .gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -2px;padding:2px}
  .gallery button{flex:0 0 46%;aspect-ratio:1/1;border:2px solid var(--gg-gray-200);border-radius:12px;overflow:hidden;padding:0;background:#f1f1f1;cursor:zoom-in;scroll-snap-align:start}
  .gallery img{width:100%;height:100%;object-fit:cover;display:block}
  .lenses{list-style:none;margin:0;padding:0}
  .lenses li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--gg-gray-200)}
  .lenses li:first-child{border-top:0}
  .lenses b{display:block;font-size:15px}
  .lenses small{display:block;color:var(--gg-gray-700);font-size:13px;line-height:1.35}
  .lenses .p{text-align:right;white-space:nowrap;font-weight:700;font-size:15px}
  .lenses .p small{font-weight:500}
  .note{font-size:13px;color:var(--gg-gray-700);text-align:center;margin:12px 0 0}
  .err{background:#fff;border:2px solid var(--gg-alert);border-radius:var(--radius);padding:14px;margin:10px 0}
  .lightbox{position:fixed;inset:0;z-index:60;background:rgba(17,17,17,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
  .lightbox[hidden]{display:none}
  .lightbox img{max-height:86vh;border-radius:12px;background:#fff}
</style>
</head>
<body>
<header>
  <img class="logo" src="brand/logo-blanco.png" alt="Gafas & Gafas">
  <button type="button" id="back" hidden>Volver</button>
  <a class="hl" id="toweb" href="https://gafasygafas.com.co/tienda/" target="_top" rel="noopener">Tienda</a>
</header>
<div class="app"><main id="main"></main></div>
<div class="sheet" id="sheet" hidden><div class="in" id="sheetin"></div></div>
<div class="lightbox" id="lightbox" hidden><img alt=""></div>
<input type="file" id="file" accept="image/*" hidden>

<script type="module">
  // ====== Configuración ======
  const MP_VERSION = '0.10.35';
  const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;   // se carga desde CDN, no desde Vercel
  const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
  const IRIS_MM = 11.7;            // diámetro promedio del iris: sirve de regla para el tamaño real
  const FRAME_DROP_MM = 2;         // el centro del lente queda un poco por debajo de la pupila
  const BOOKING_URL = 'https://gafasygafas.com.co/agendar-cita-examen-visual/';
  const UTM = { utm_source: 'probador', utm_medium: 'app', utm_campaign: 'probador-virtual' };
  // Opciones de lente de la ficha de producto (configurador de la web). Actualizar si cambian los precios.
  const LENSES = [
    { name: 'Solo el marco', desc: 'Sin aumento. Ideal si le pondrás los lentes después.', price: 0 },
    { name: 'Lentes sencillos', desc: 'Protección UV400 (no oscurece) con antirreflejo sencillo.', price: 185000 },
    { name: 'Lentes para computador', desc: 'Con filtro de luz azul para el uso de pantallas.', price: 242900 },
    { name: 'Lentes para conducir', desc: 'Antirreflejo con mejor contraste en diferentes luces.', price: 370000 },
    { name: 'Lentes progresivos', desc: 'Cerca, media distancia y lejos. Se hacen en tienda con nuestros optómetras.', price: null },
  ];
  const FILTERS = [['', 'Todas'], ['acetatos', 'Acetato'], ['tr90', 'TR90'], ['metalicos', 'Metálicas'], ['hibridos', 'Híbridas']];

  const $main = document.getElementById('main');
  const $back = document.getElementById('back');
  const $toweb = document.getElementById('toweb');
  const $file = document.getElementById('file');
  const $sheet = document.getElementById('sheet');
  const $lightbox = document.getElementById('lightbox');
  const query = new URLSearchParams(location.search);
  const PATHS = {
    camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-9 8.5"/>',
    bag: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    face: '<circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="11" r="2"/><circle cx="15.5" cy="11" r="2"/><path d="M10.5 11h3"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.5v.01"/>',
  };
  const ico = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${PATHS[n]}</svg>`;
  const money = (v) => '$ ' + Number(v).toLocaleString('es-CO');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function track(event, data) {
    const payload = Object.assign({ event }, data);
    try { (window.dataLayer = window.dataLayer || []).push(payload); } catch (e) {}
    try { if (typeof window.gtag === 'function') window.gtag('event', event, data || {}); } catch (e) {}
    try { if (window.parent !== window) window.parent.postMessage({ type: 'probador', event, data }, '*'); } catch (e) {}
  }
  const withUtm = (url, content, extra) => {
    const u = new URL(url);
    Object.entries(extra || {}).forEach(([k, v]) => v && u.searchParams.set(k, v));
    Object.entries(UTM).forEach(([k, v]) => u.searchParams.set(k, query.get(k) || v));
    if (content) u.searchParams.set('utm_content', content);
    return u.toString();
  };

  // ====== Estado ======
  let CAT = [];
  const imgs = {};
  let sel = { f: 0, c: 0 };
  let filter = '';
  let landmarker = null, lmMode = null;
  let stream = null, raf = 0, video = null;
  let source = null;          // 'camera' | 'photo'
  let photo = null;           // foto subida (canvas)
  let photoPose = null;
  let smooth = null;
  let sizeAdj = 1;

  const cur = () => CAT[sel.f];
  const curColor = () => cur().colors[sel.c];
  const visible = () => CAT.map((f, i) => i).filter((i) => !filter || CAT[i].cat === filter);
  const catLine = (f) => [f.cat_label, f.gender].filter(Boolean).join(' · ');
  const cardPhoto = (f) => f.colors[0].photo || f.gallery[0] || f.colors[0].img;

  function loadImg(src) {
    if (imgs[src]) return imgs[src];
    const im = new Image(); im.decoding = 'async'; im.src = src; imgs[src] = im; return im;
  }

  // ====== Detector de rostro (MediaPipe Face Landmarker) ======
  async function getLandmarker(mode) {
    if (!landmarker) {
      const { FaceLandmarker, FilesetResolver } = await import(`${MP_BASE}/vision_bundle.mjs`);
      const files = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
      const opts = (delegate) => ({ baseOptions: { modelAssetPath: MP_MODEL, delegate }, runningMode: mode, numFaces: 1 });
      try { landmarker = await FaceLandmarker.createFromOptions(files, opts('GPU')); }
      catch (e) { landmarker = await FaceLandmarker.createFromOptions(files, opts('CPU')); }
      lmMode = mode;
    } else if (lmMode !== mode) {
      await landmarker.setOptions({ runningMode: mode }); lmMode = mode;
    }
    return landmarker;
  }

  // Posición de los ojos, inclinación y escala (px por mm) a partir de los puntos de la cara
  function facePose(lms, W, H) {
    const P = (i) => ({ x: lms[i].x * W, y: lms[i].y * H });
    const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    if (lms.length < 478) return null;
    const a = P(468), b = P(473);
    const [L, R] = a.x < b.x ? [a, b] : [b, a];
    const eyeDist = d(a, b);
    const iris = (d(P(469), P(471)) + d(P(474), P(476))) / 2;
    // El iris da la escala real; se limita a un rango de distancia entre pupilas humano (54–72 mm)
    const pxmm = Math.min(Math.max(iris / IRIS_MM, eyeDist / 72), eyeDist / 54);
    return { x: (L.x + R.x) / 2, y: (L.y + R.y) / 2, ang: Math.atan2(R.y - L.y, R.x - L.x), pxmm };
  }
  function blend(prev, p, k = 0.5) {
    if (!prev) return p;
    return { x: prev.x + (p.x - prev.x) * k, y: prev.y + (p.y - prev.y) * k, ang: prev.ang + (p.ang - prev.ang) * k, pxmm: prev.pxmm + (p.pxmm - prev.pxmm) * k };
  }

  function drawGlasses(ctx, p) {
    const f = cur(), c = curColor(), im = loadImg(c.img);
    if (!im.complete || !im.naturalWidth) return;
    const lensGapImg = c.lensR[0] - c.lensL[0];
    const k = im.naturalWidth / c.w;                       // por si la imagen se sirve a otro tamaño
    const s = ((f.lens + f.bridge) * p.pxmm * sizeAdj) / (lensGapImg * k);
    const cx = ((c.lensL[0] + c.lensR[0]) / 2) * k, cy = ((c.lensL[1] + c.lensR[1]) / 2) * k;
    ctx.save();
    ctx.translate(p.x, p.y + FRAME_DROP_MM * p.pxmm);
    ctx.rotate(p.ang);
    ctx.scale(s, s);
    ctx.shadowColor = 'rgba(0,0,0,.16)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
    ctx.drawImage(im, -cx, -cy);
    ctx.restore();
  }

  // ====== Pantallas ======
  function html(s) { $main.innerHTML = s; }
  function on(sel, fn, root = $main) { root.querySelectorAll(sel).forEach((el) => el.addEventListener('click', fn)); }
  const chipsHtml = () => FILTERS.filter(([k]) => !k || CAT.some((f) => f.cat === k))
    .map(([k, l]) => `<button type="button" data-k="${k}" class="${k === filter ? 'on' : ''}">${l}</button>`).join('');

  function showHome() {
    stopCamera(); source = null; $back.hidden = true; $toweb.hidden = false; closeSheet(); window.scrollTo(0, 0);
    html(`
      <p class="eyebrow">Probador virtual</p>
      <h1>Pruébatelas <mark>antes de comprar.</mark></h1>
      <p class="lead">Elige una montura y mírate con la cámara de tu celular o con una foto.</p>
      <div class="two">
        <button type="button" class="btn" id="cam">${ico('camera')} Abrir cámara</button>
        <button type="button" class="btn outline" id="pic">${ico('image')} Subir foto</button>
      </div>
      <ul class="ticks">
        <li>Quítate tus gafas y mira de frente</li>
        <li>Nada se graba ni se envía</li>
        <li>Tamaño aproximado según la ficha</li>
      </ul>
      <div class="sechead"><span class="tag">Descubre</span><span class="count" id="count"></span></div>
      <div class="chips" id="chips">${chipsHtml()}</div>
      <div class="grid" id="grid"></div>
      <p class="tagline">Nos salimos del marco</p>
      <p class="foot">¿Prefieres que te asesoremos? <a href="${withUtm(BOOKING_URL, 'probador-home')}" target="_top" rel="noopener">Agenda tu examen visual</a></p>
    `);
    renderGrid();
    on('#chips button', (e) => { filter = e.currentTarget.dataset.k; document.querySelectorAll('#chips button').forEach((b) => b.classList.toggle('on', b.dataset.k === filter)); renderGrid(); });
    on('#cam', () => startCamera());
    on('#pic', () => $file.click());
  }
  function renderGrid() {
    const ids = visible();
    document.getElementById('count').textContent = `${ids.length} monturas`;
    document.getElementById('grid').innerHTML = ids.map((i) => {
      const f = CAT[i];
      return `<button type="button" class="card" data-f="${i}">
        <span class="ph"><img src="${esc(cardPhoto(f))}" alt="${esc(f.code)}" loading="lazy"><span class="try">${ico('face')} Pruébatelas</span></span>
        <span class="bd"><b>${esc(f.code)}</b><span class="meta">${esc(catLine(f))}</span>
        <span class="row"><span class="price">${money(f.price)}</span><span class="go">${ico('arrow')}</span></span></span>
      </button>`;
    }).join('');
    on('#grid .card', (e) => openSheet(+e.currentTarget.dataset.f));
  }

  function openSheet(fi) {
    sel = { f: fi, c: 0 };
    const f = cur();
    document.getElementById('sheetin').innerHTML = `
      <div class="pick"><img src="${curColor().thumb}" alt=""><div><span class="eyebrow" style="font-size:11px">${esc(catLine(f))}</span><h2 style="margin:4px 0 0">${esc(f.code)}</h2><b>${money(f.price)}</b></div></div>
      <p style="margin:0 0 12px;font-weight:700">¿Cómo te las quieres probar?</p>
      <div class="stack">
        <button type="button" class="btn" id="scam">${ico('camera')} Con mi cámara</button>
        <button type="button" class="btn outline" id="spic">${ico('image')} Con una foto</button>
      </div>
      <button type="button" class="x" id="sx">Cancelar</button>`;
    $sheet.hidden = false;
    on('#scam', () => startCamera(), $sheet);
    on('#spic', () => $file.click(), $sheet);
    on('#sx', closeSheet, $sheet);
    track('pr_card', { modelo: f.code });
  }
  function closeSheet() { $sheet.hidden = true; }
  $sheet.addEventListener('click', (e) => { if (e.target === $sheet) closeSheet(); });

  function tryonShell(note) {
    closeSheet(); $back.hidden = false; $toweb.hidden = true; window.scrollTo(0, 0);
    html(`
      <div class="stagewrap" id="stage">
        <canvas id="cv" width="720" height="960"></canvas>
        <div class="oval" id="oval" hidden></div>
        <div class="hint" id="hint" hidden></div>
        <span class="approx">Tamaño aproximado</span>
        <div class="loading" id="loading"><div><div class="spin"></div><b>Preparando el probador…</b><p style="margin:6px 0 0;font-size:14px;color:#bbb">La primera vez tarda unos segundos.</p></div></div>
      </div>
      <div class="chips" id="chips" style="padding-top:12px">${chipsHtml()}</div>
      <div class="strip" id="strip"></div>
      <section class="panel">
        <div class="info"><div><span class="cat" id="fcat"></span><b id="fname"></b></div><span class="price" id="fprice"></span></div>
        <p class="lbl">Color <em id="cname"></em></p>
        <div class="swatches" id="sw"></div>
        <p class="lbl">Tamaño</p>
        <div class="sizer"><button type="button" id="smaller" aria-label="Más pequeña">−</button><button type="button" id="bigger" aria-label="Más grande">+</button><span>Ajusta si la ves muy grande o pequeña</span></div>
        <p class="sizenote" id="sizenote"></p>
      </section>
      <section class="panel">
        <h2>Así es en la tienda</h2>
        <div class="gallery" id="gallery"></div>
      </section>
      <section class="panel">
        <h2>Elige tus lentes</h2>
        <ul class="lenses" id="lenses"></ul>
        <div class="stack" style="margin-top:12px">
          <a class="btn" id="buy" target="_top" rel="noopener">${ico('bag')} Elegir lentes y comprar</a>
        </div>
        <p class="note" style="text-align:left">Te llevamos a la ficha con este color. Toca <b>«Continuar con la compra»</b> para escoger tus lentes y enviar tu fórmula.</p>
      </section>
      <div class="two" style="margin-top:14px">
        <button type="button" class="btn outline small" id="shot">${ico('camera')} Guardar foto</button>
        <a class="btn outline small" id="agenda" target="_top" rel="noopener">${ico('cal')} Agendar examen</a>
      </div>
      <p class="note">${note || 'La imagen se procesa en tu celular. No se graba ni se envía.'}</p>
    `);
    renderStrip();
    on('#chips button', (e) => {
      filter = e.currentTarget.dataset.k;
      document.querySelectorAll('#chips button').forEach((b) => b.classList.toggle('on', b.dataset.k === filter));
      renderStrip();
      const ids = visible(); if (ids.length && !ids.includes(sel.f)) pickFrame(ids[0], 0);
    });
    on('#smaller', () => { sizeAdj = Math.max(0.8, sizeAdj - 0.04); redrawPhoto(); });
    on('#bigger', () => { sizeAdj = Math.min(1.2, sizeAdj + 0.04); redrawPhoto(); });
    on('#shot', takePhoto);
    on('#buy', () => track('pr_cta_buy', { modelo: cur().code, color: curColor().name }));
    on('#agenda', () => track('pr_cta_agenda', { modelo: cur().code }));
    pickFrame(sel.f, sel.c);
  }
  function renderStrip() {
    const strip = document.getElementById('strip');
    strip.innerHTML = visible().map((i) => `<button type="button" data-f="${i}" class="${i === sel.f ? 'sel' : ''}"><img src="${CAT[i].colors[0].thumb}" alt="" loading="lazy"><span>${esc(CAT[i].code)}</span></button>`).join('');
    on('#strip button', (e) => pickFrame(+e.currentTarget.dataset.f, 0));
  }

  function pickFrame(fi, ci) {
    sel = { f: fi, c: ci };
    const f = cur(), c = curColor();
    $main.querySelectorAll('#strip button').forEach((b) => {
      const on = +b.dataset.f === fi; b.classList.toggle('sel', on);
      if (on) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    });
    $main.querySelector('#fcat').textContent = catLine(f);
    $main.querySelector('#fname').textContent = f.code;
    $main.querySelector('#fprice').innerHTML = (f.regular > f.price ? `<s>${money(f.regular)}</s>` : '') + money(f.price);
    $main.querySelector('#cname').textContent = c.name || (f.colors.length === 1 ? 'Más colores en la tienda' : '');
    const sw = $main.querySelector('#sw');
    sw.innerHTML = f.colors.map((x, i) => `<button type="button" data-c="${i}" class="${i === ci ? 'sel' : ''}" style="background:${x.swatch}" aria-label="${esc(x.name || f.code)}"></button>`).join('');
    sw.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => pickFrame(fi, +b.dataset.c)));
    $main.querySelector('#sizenote').innerHTML = `${ico('info')}<span><b>El tamaño es aproximado.</b> Lo calculamos con las medidas de la ficha (lente ${f.lens} mm · puente ${f.bridge} mm${f.temple ? ` · brazo ${f.temple} mm` : ''}) y una medida promedio del ojo, así que puede variar un poco. Para saber cómo te queda de verdad, pruébatelas en tienda.</span>`;
    const photos = [c.photo, ...f.gallery].filter((u, i, a) => u && a.indexOf(u) === i);
    $main.querySelector('#gallery').innerHTML = photos.map((u) => `<button type="button" data-src="${esc(u)}"><img src="${esc(u)}" alt="${esc(f.code)}" loading="lazy"></button>`).join('');
    on('#gallery button', (e) => openLightbox(e.currentTarget.dataset.src));
    $main.querySelector('#lenses').innerHTML = LENSES.map((l) => `<li><span><b>${l.name}</b><small>${l.desc}</small></span><span class="p">${
      l.price === null ? 'En tienda' : l.price === 0 ? `${money(f.price)}<small>Incluido</small>` : `+ ${money(l.price)}<small>Total ${money(f.price + l.price)}</small>`}</span></li>`).join('');
    $main.querySelector('#buy').href = withUtm(f.url, f.code, { attribute_color: c.attr });
    $main.querySelector('#agenda').href = withUtm(BOOKING_URL, 'probador-' + f.code);
    loadImg(c.img).decode?.().then(redrawPhoto).catch(() => {});
    redrawPhoto();
    track('pr_frame', { modelo: f.code, color: c.name });
  }

  function openLightbox(src) { $lightbox.querySelector('img').src = src; $lightbox.hidden = false; }
  $lightbox.addEventListener('click', () => { $lightbox.hidden = true; });

  function setHint(text, oval) {
    const h = document.getElementById('hint'), o = document.getElementById('oval');
    if (!h) return;
    h.hidden = !text; if (text) h.textContent = text;
    if (o) o.hidden = !oval;
  }
  function setLoading(on) { const l = document.getElementById('loading'); if (l) l.hidden = !on; }

  // ====== Cámara ======
  async function startCamera() {
    source = 'camera'; photo = null; smooth = null;
    tryonShell();
    track('pr_start', { modo: 'camara' });
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw Object.assign(new Error('nocam'), { name: 'NotSupportedError' });
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } }, audio: false });
      video = document.createElement('video');
      video.playsInline = true; video.muted = true; video.srcObject = stream;
      await video.play();
      await getLandmarker('VIDEO');
      setLoading(false);
      loop();
    } catch (e) {
      stopCamera(); setLoading(false);
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      document.getElementById('stage').outerHTML = `<div class="err"><b>${denied ? 'No tenemos permiso para usar tu cámara.' : 'No pudimos abrir la cámara en este navegador.'}</b>
        <p style="margin:6px 0 10px;font-size:14px;color:var(--gg-gray-700)">${denied ? 'Puedes darlo en la configuración del navegador, o usar una foto.' : 'Si abriste el link desde Instagram, ábrelo en Chrome o Safari. También puedes usar una foto.'}</p>
        <button type="button" class="btn outline small" id="pic2">${ico('image')} Subir una foto</button></div>`;
      on('#pic2', () => $file.click());
      track('pr_camera_error', { error: e && e.name });
    }
  }
  function stopCamera() {
    cancelAnimationFrame(raf); raf = 0;
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null; video = null;
  }
  function loop() {
    const cv = document.getElementById('cv');
    if (!cv || !video || source !== 'camera') return;
    if (video.readyState >= 2 && video.videoWidth) {
      if (cv.width !== video.videoWidth) { cv.width = video.videoWidth; cv.height = video.videoHeight; }
      const ctx = cv.getContext('2d');
      const res = landmarker.detectForVideo(video, performance.now());
      ctx.save(); ctx.translate(cv.width, 0); ctx.scale(-1, 1);   // vista espejo, como una selfie
      ctx.drawImage(video, 0, 0, cv.width, cv.height);
      const lms = res && res.faceLandmarks && res.faceLandmarks[0];
      const p = lms && facePose(lms, cv.width, cv.height);
      if (p) { smooth = blend(smooth, p, 0.55); drawGlasses(ctx, smooth); setHint(''); }
      else { smooth = null; setHint('Pon tu cara de frente dentro del óvalo', true); }
      ctx.restore();
    }
    raf = requestAnimationFrame(loop);
  }

  // ====== Foto ======
  $file.addEventListener('change', async () => {
    const f = $file.files && $file.files[0]; $file.value = '';
    if (!f) return;
    stopCamera(); source = 'photo'; smooth = null;
    tryonShell('Tu foto se procesa en tu celular. No se guarda ni se envía.');
    track('pr_start', { modo: 'foto' });
    try {
      const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' });
      const scale = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      photo = c;
      const lm = await getLandmarker('IMAGE');
      const res = lm.detect(photo);
      const lms = res && res.faceLandmarks && res.faceLandmarks[0];
      photoPose = lms ? facePose(lms, photo.width, photo.height) : null;
      setLoading(false);
      redrawPhoto();
      if (!photoPose) setHint('No encontramos una cara en esa foto. Prueba con una de frente, con buena luz y sin gafas.');
    } catch (e) {
      setLoading(false); setHint('No pudimos abrir esa foto. Prueba con otra.');
    }
  });
  function redrawPhoto() {
    if (source !== 'photo' || !photo) return;
    const cv = document.getElementById('cv'); if (!cv) return;
    cv.width = photo.width; cv.height = photo.height;
    const ctx = cv.getContext('2d');
    ctx.drawImage(photo, 0, 0);
    if (photoPose) drawGlasses(ctx, photoPose);
  }

  // ====== Guardar foto (con marca) ======
  async function takePhoto() {
    const cv = document.getElementById('cv'); if (!cv) return;
    const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
    const ctx = out.getContext('2d'); ctx.drawImage(cv, 0, 0);
    const bar = Math.round(out.height * 0.08);
    ctx.fillStyle = 'rgba(17,17,17,.82)'; ctx.fillRect(0, out.height - bar, out.width, bar);
    const logo = loadImg('brand/logo-blanco.png');
    try { await logo.decode(); } catch (e) {}
    const lh = bar * 0.62, lw = lh * (logo.naturalWidth / logo.naturalHeight || 2.2);
    if (logo.naturalWidth) ctx.drawImage(logo, bar * 0.3, out.height - bar + (bar - lh) / 2, lw, lh);
    ctx.fillStyle = '#FFD756'; ctx.font = `${Math.round(bar * 0.34)}px Anton, Impact, sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(`${cur().code} · gafasygafas.com.co`, out.width - bar * 0.3, out.height - bar / 2);
    out.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], `probador-gg-${cur().code}.jpg`, { type: 'image/jpeg' });
      track('pr_photo', { modelo: cur().code });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Mi prueba en Gafas & Gafas' }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    }, 'image/jpeg', 0.9);
  }

  $back.addEventListener('click', showHome);
  document.addEventListener('visibilitychange', () => { if (document.hidden && source === 'camera') { stopCamera(); showHome(); } });

  // ====== Inicio ======
  try {
    CAT = await (await fetch('monturas/catalogo.json')).json();
    // ?ref=WD1168 abre el probador con esa montura (para enlazar desde la ficha del producto)
    const ref = (query.get('ref') || '').toUpperCase();
    const refIdx = CAT.findIndex((f) => f.code.toUpperCase() === ref);
    if (query.has('debug')) window.__pr = { facePose, get photoPose() { return photoPose; }, get sel() { return sel; } };
    showHome();
    if (refIdx >= 0) openSheet(refIdx);
  } catch (e) {
    html('<div class="err">No pudimos cargar las monturas. Recarga la página.</div>');
  }
</script>
</body>
</html>
